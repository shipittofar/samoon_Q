  /api/access/tenants/{tenant_id}/staff-assignments/:
    get:
      operationId: api_access_tenants_staff_assignments_list
      description: Creates a canonical role grant scoped by location_ids and/or all_locations.
        One assignment row represents one role grant; multiple locations use the StaffAssignmentLocation
        junction.
      summary: List or create staff role assignments
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: path
        name: tenant_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Access - Staff Assignment
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedStaffAssignmentList'
