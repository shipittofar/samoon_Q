components:
  schemas:
    ActiveMembershipOutput:
      type: object
      properties:
        tenantId:
          type: string
          format: uuid
          nullable: true
        branchId:
          type: string
          format: uuid
          nullable: true
        tenantIsActive:
          type: boolean
          nullable: true
        tenantStatus:
          type: string
          nullable: true
      required:
      - branchId
      - tenantId
    AddressResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        uuid:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          readOnly: true
          description: Address label derived from address_type (e.g. Home, Work).
        address_type:
          type: string
          readOnly: true
        custom_label:
          type: string
          readOnly: true
        label:
          type: string
          readOnly: true
        type_display:
          type: string
          readOnly: true
        first_name:
          type: string
          readOnly: true
          description: Populated from authenticated user profile.
        last_name:
          type: string
          readOnly: true
          description: Populated from authenticated user profile.
        company:
          type: string
          readOnly: true
        phone:
          type: string
          readOnly: true
          description: Populated from authenticated user profile.
        country_code:
          type: string
          readOnly: true
          description: Populated from authenticated user profile.
        country:
          type: string
          readOnly: true
          description: ISO 3166-1 alpha-2 country code.
        province:
          type: string
          readOnly: true
        city:
          type: string
          readOnly: true
        district:
          type: string
          readOnly: true
        street:
          type: string
          readOnly: true
        building_number:
          type: string
          readOnly: true
        unit:
          type: string
          readOnly: true
        floor:
          type: string
          readOnly: true
        postal_code:
          type: string
          readOnly: true
        latitude:
          type: number
          format: double
          readOnly: true
          nullable: true
        longitude:
          type: number
          format: double
          readOnly: true
          nullable: true
        formatted_address:
          type: string
          readOnly: true
        delivery_notes:
          type: string
          readOnly: true
        is_default:
          type: boolean
          readOnly: true
        verification_status:
          allOf:
          - $ref: '#/components/schemas/VerificationStatusEnum'
          readOnly: true
        is_verified:
          type: boolean
          readOnly: true
        verified_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        verification_source:
          type: string
          readOnly: true
