openapi: 3.0.3
info:
  title: Samoon API
  version: 1.19.2
paths:
  /:
    get:
      operationId: root_retrieve
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/access/permissions/:
    get:
      operationId: api_access_permissions_list
      description: Returns all available system permissions.
      summary: List permissions
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - Access - Permission
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPermissionList'
          description: ''
  /api/access/permissions/{permission_id}/:
    get:
      operationId: api_access_permissions_retrieve
      description: Returns details of a specific system permission.
      summary: Retrieve permission
      parameters:
      - in: path
        name: permission_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Access - Permission
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Permission'
          description: ''
  /api/access/roles/:
    get:
      operationId: api_access_roles_list
      description: Returns all system roles or creates a new role.
      summary: List or create roles
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - Access - Role
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRoleList'
          description: ''
    post:
      operationId: api_access_roles_create
      description: Returns all system roles or creates a new role.
      summary: List or create roles
      tags:
      - Access - Role
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RoleCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RoleCreateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleCreate'
          description: ''
  /api/access/roles/{role_id}/:
    get:
      operationId: api_access_roles_retrieve
      description: Returns details of a specific role or permanently deletes it.
      summary: Retrieve or delete role
      parameters:
      - in: path
        name: role_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Access - Role
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
          description: ''
    delete:
      operationId: api_access_roles_destroy
      description: Returns details of a specific role or permanently deletes it.
      summary: Retrieve or delete role
      parameters:
      - in: path
        name: role_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Access - Role
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/access/roles/{role_id}/permissions/:
    get:
      operationId: api_access_roles_permissions_retrieve
      description: GET returns the role's permissions. PUT replaces all permissions
        atomically. POST adds permissions without removing existing ones.
      summary: List, replace, or add role permissions
      parameters:
      - in: path
        name: role_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Access - Role
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
    post:
      operationId: api_access_roles_permissions_create
      description: GET returns the role's permissions. PUT replaces all permissions
        atomically. POST adds permissions without removing existing ones.
      summary: List, replace, or add role permissions
      parameters:
      - in: path
        name: role_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Access - Role
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
    put:
      operationId: api_access_roles_permissions_update
      description: GET returns the role's permissions. PUT replaces all permissions
        atomically. POST adds permissions without removing existing ones.
      summary: List, replace, or add role permissions
      parameters:
      - in: path
        name: role_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Access - Role
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/access/switch-branch/:
    post:
      operationId: api_access_switch_branch_create
      description: Switches the authenticated user's active branch within their active
        tenant.
      summary: Switch active branch
      tags:
      - Access - Staff Membership
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SwitchActiveBranchInputRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SwitchActiveBranchInputRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SwitchActiveBranchInputRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SwitchActiveBranchInput'
          description: ''
