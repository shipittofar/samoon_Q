          maxLength: 50
        branch_id:
          type: string
          format: uuid
          readOnly: true
        branch_name:
          type: string
          readOnly: true
        branch_slug:
          type: string
          readOnly: true
        tenant_id:
          type: string
          format: uuid
          readOnly: true
        tenant_name:
          type: string
          readOnly: true
        tenant_slug:
          type: string
          readOnly: true
        tenant_is_active:
          type: boolean
          readOnly: true
        tenant_status:
          type: string
          readOnly: true
        tenant:
          type: string
          readOnly: true
        order_type:
          $ref: '#/components/schemas/OrderTypeEnum'
        status:
          $ref: '#/components/schemas/Status3d3Enum'
        payment_method:
          $ref: '#/components/schemas/PaymentMethodEnum'
        payment_status:
          $ref: '#/components/schemas/PaymentStatusEnum'
        table_number:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
          description: Required only for dine-in orders
        discount_code:
          type: string
          maxLength: 50
        subtotal:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        discount_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        tax:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          description: Snapshot tax amount. Computed in the Service layer from branch.tenant.tax
            at order creation time; do not edit directly.
        service_charge:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          description: Mandatory restaurant-added service fee (not a customer tip).
        total:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        notes:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItemResponse'
          readOnly: true
        delivery_address:
          allOf:
          - $ref: '#/components/schemas/DeliveryAddressResponse'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
