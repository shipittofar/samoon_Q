#name: savor-restaurant

services:
  # ── Next.js App ─────────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: savor-app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:-http://api:8000/api}
      - NEXT_PUBLIC_WS_BASE_URL=${NEXT_PUBLIC_WS_BASE_URL:-ws://api:8000/ws}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      - NEXT_PUBLIC_USE_MOCK=${NEXT_PUBLIC_USE_MOCK:-false}
    expose:
      - "3000"
    networks:
      - savor-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.savor.rule=Host(`savor.com`)"

  # ── Nginx Reverse Proxy ──────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: savor-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - app
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/app/staticfiles:ro
      - nginx-cache:/var/cache/nginx
    networks:
      - savor-net
      - shared-net

volumes:
  static_volume:
    external: true
    name: backend_static_volume
  nginx-cache:

networks:
  savor-net:
    driver: bridge
  shared-net:
    external: true