name: samoon-restaurant

services:
  # ── Next.js App ─────────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      # NEXT_PUBLIC_* are baked into the client bundle at build time.
      # Use browser-reachable URLs here (not internal service names).
      args:
        - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000/api}
        - NEXT_PUBLIC_WS_BASE_URL=${NEXT_PUBLIC_WS_BASE_URL:-ws://localhost:8000/ws}
        - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
        - NEXT_PUBLIC_MEDIA_BASE_URL=${NEXT_PUBLIC_MEDIA_BASE_URL:-}
        - NEXT_PUBLIC_ROOT_DOMAIN=${NEXT_PUBLIC_ROOT_DOMAIN:-}
        - NEXT_PUBLIC_USE_MOCK=${NEXT_PUBLIC_USE_MOCK:-false}
        - NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
        - NEXT_PUBLIC_SENTRY_DSN=${NEXT_PUBLIC_SENTRY_DSN:-}
    container_name: samoon-app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:-http://api:8000/api}
      - NEXT_PUBLIC_WS_BASE_URL=${NEXT_PUBLIC_WS_BASE_URL:-ws://api:8000/ws}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      - NEXT_PUBLIC_USE_MOCK=${NEXT_PUBLIC_USE_MOCK:-false}
      # Server-side calls go straight to Django over shared-net (no TLS hop).
      - INTERNAL_API_BASE_URL=${INTERNAL_API_BASE_URL:-http://smartrestaurant-web:8000/api}
    expose:
      - "3000"
    networks:
      - samoon-net
      - shared-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.samoon.rule=Host(`samoon.com`)"

  # ── Nginx Reverse Proxy ──────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: samoon-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/app/staticfiles:ro
      - nginx-cache:/var/cache/nginx
      # TLS: certificate copies kept by deploy/ssl.sh (Let's Encrypt), read by nginx.
      - /etc/samoon/ssl:/etc/nginx/ssl:ro
      # Let's Encrypt HTTP-01 challenge files (certbot writes here, nginx serves them).
      - /var/www/certbot:/var/www/certbot:ro
    networks:
      - samoon-net
      - shared-net

volumes:
  static_volume:
    external: true
    name: backend_static_volume
  nginx-cache:

networks:
  samoon-net:
    driver: bridge
  shared-net:
    external: true


