services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: samoon-app-dev
    command: npm run dev
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    env_file:
      - .env.local
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_USE_MOCK=true

      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - WATCHPACK_POLLING_RATE=1000
      # ===========================
    ports:
      - "3000:3000"
    restart: unless-stopped

    stdin_open: true
    tty: true


