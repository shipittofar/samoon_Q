services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: samoon-app-dev
    command: npm run dev
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    env_file:
      - .env.local
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_USE_MOCK=false
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - WATCHPACK_POLLING_RATE=1000
    ports:
      - "3000:3000"
    restart: unless-stopped
    stdin_open: true
    tty: true
    networks:
      - shared-net

  nginx:
    image: nginx:alpine
    container_name: samoon-nginx-dev
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - backend_static_volume:/app/staticfiles:ro
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - shared-net

networks:
  shared-net:
    external: true


volumes:
  backend_static_volume:
    external: true
    name: backend_static_volume


